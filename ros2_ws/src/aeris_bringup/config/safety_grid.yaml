aeris_safety:
  ros__parameters:
    pose_topic: /fmu/out/vehicle_local_position_v1
    battery_topic: /fmu/out/battery_status_v1
    vehicle_status_topic: /fmu/out/vehicle_status_v1
    control_mode_topic: /fmu/out/vehicle_control_mode
    mission_status_topic: /aeris_mission_manager/status
    status_topic: /aeris/safety/status

    land_service: /aeris_offboard_controller/land
    rtl_service: /aeris_offboard_controller/rtl
    hold_service: /aeris_offboard_controller/hold

    publish_rate_hz: 10.0
    action_retry_interval_s: 2.0

    pose_timeout_s: 1.0
    battery_min_remaining: 0.25
    # The city grid spans 40 m in each axis; the far corner is ~56.6 m
    # from the start at (0,0). Keep a margin above that.
    geofence_radius_m: 70.0
    geofence_center_x: 0.0
    geofence_center_y: 0.0

    # Grid navigation does not publish MissionStatus; it runs its own
    # safety watchdog. Keep the mission-heartbeat monitor disabled here.
    mission_heartbeat_timeout_s: 3.0
    require_mission_heartbeat: false

    action_for_stale_pose: land
    action_for_low_battery: rtl
    action_for_geofence_breach: rtl
    action_for_mission_heartbeat_loss: rtl
