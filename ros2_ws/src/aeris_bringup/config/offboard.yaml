aeris_offboard_controller:
  ros__parameters:
    # Safety: the mission is triggered explicitly with:
    #   ros2 service call /aeris_offboard_controller/start std_srvs/srv/Trigger
    # Set auto_start to true only for an unattended simulation demo.
    auto_start: false
    start_delay_s: 5.0

    takeoff_altitude_m: 5.0
    hold_duration_s: 10.0

    # PX4's offboard-loss timeout is 1.0 s by default (COM_OF_LOSS_T).
    # 20 Hz gives a large margin.
    setpoint_rate_hz: 20.0
    prestream_duration_s: 2.0

    mode_timeout_s: 10.0
    arm_timeout_s: 10.0
    takeoff_timeout_s: 30.0
    land_timeout_s: 45.0

    position_tolerance_m: 0.3
    takeoff_speed_mps: 1.0
    max_altitude_m: 10.0
    max_horizontal_distance_m: 20.0
    max_hold_error_m: 1.0
    telemetry_timeout_s: 1.0
    abort_grace_s: 2.0
