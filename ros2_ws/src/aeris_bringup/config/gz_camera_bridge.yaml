# Gazebo -> ROS 2 bridge for the X500 downward monocular camera.
# The Gazebo model instance is produced by PX4's gz_x500_mono_cam_down target.
- ros_topic_name: "/aeris/camera/image_raw"
  gz_topic_name: "/world/default/model/x500_mono_cam_down_0/link/camera_link/sensor/imager/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/aeris/camera/camera_info"
  gz_topic_name: "/world/default/model/x500_mono_cam_down_0/link/camera_link/sensor/imager/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
