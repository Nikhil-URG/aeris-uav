grid:
  name: city_grid
  width: 11
  height: 11
  cell_size_m: 4.0
  start:
    x: 0
    y: 0
  cruise_altitude_m: 5.0

  # Spread-out city: nine 2x2 blocks on a regular 3x3 lattice, with
  # one-cell streets between them. The start cell (0,0) is free.
  buildings:
    - {x: 2, y: 2, width: 2, height: 2, height_m: 10.0}
    - {x: 5, y: 2, width: 2, height: 2, height_m: 12.0}
    - {x: 8, y: 2, width: 2, height: 2, height_m: 14.0}

    - {x: 2, y: 5, width: 2, height: 2, height_m: 16.0}
    - {x: 5, y: 5, width: 2, height: 2, height_m: 10.0}
    - {x: 8, y: 5, width: 2, height: 2, height_m: 12.0}

    - {x: 2, y: 8, width: 2, height: 2, height_m: 14.0}
    - {x: 5, y: 8, width: 2, height: 2, height_m: 16.0}
    - {x: 8, y: 8, width: 2, height: 2, height_m: 12.0}
